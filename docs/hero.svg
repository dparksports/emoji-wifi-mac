<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="EmojiWifi — WiFi names and passwords made entirely of emoji">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="878" height="238" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Left column -->
