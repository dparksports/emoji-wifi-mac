  <text x="48" y="118" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#111827">Emoji<tspan fill="#0A84FF">Wifi</tspan></text>
  <text x="48" y="146" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">WiFi names &amp; passwords made entirely of emoji —</text>
  <text x="48" y="167" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563">generate, scan, and join in one native macOS app.</text>

  <!-- Chips -->
  <rect x="48" y="192" width="94" height="26" rx="13" fill="#eaf2ff"/>
  <text x="95" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0A84FF">macOS 13+</text>
  <rect x="152" y="192" width="80" height="26" rx="13" fill="#f5ecfe"/>
  <text x="192" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#8b3dcf">SwiftUI</text>
  <rect x="242" y="192" width="190" height="26" rx="13" fill="#e6f6ec"/>
  <text x="337" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1e8e3e">Swift Package Manager</text>
  <rect x="442" y="192" width="104" height="26" rx="13" fill="#f1f3f5"/>
  <text x="494" y="210" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#495057">Apache-2.0</text>

