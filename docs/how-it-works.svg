<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="How it works: pick a style, tune the password, get the QR code, scan or join">
  <style>
    .t { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 650; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .emoji { font-size: 26px; }
  </style>
  <rect x="1" y="1" width="878" height="208" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Step 1 -->
  <circle cx="128" cy="34" r="11" fill="#0A84FF"/>
  <text x="128" y="38" text-anchor="middle" class="t num">1</text>
  <circle cx="128" cy="88" r="34" fill="#0A84FF" fill-opacity="0.12"/>
  <text x="128" y="97" text-anchor="middle" class="t emoji">🎲</text>
  <text x="128" y="152" text-anchor="middle" class="t title">Pick a style</text>
  <text x="128" y="174" text-anchor="middle" class="t sub">Combination · Single · Random</text>

  <path d="M 226 80 l 14 8 l -14 8" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <circle cx="336" cy="34" r="11" fill="#FF9500"/>
  <text x="336" y="38" text-anchor="middle" class="t num">2</text>
  <circle cx="336" cy="88" r="34" fill="#FF9500" fill-opacity="0.12"/>
  <text x="336" y="97" text-anchor="middle" class="t emoji">🎚️</text>
  <text x="336" y="152" text-anchor="middle" class="t title">Tune the password</text>
  <text x="336" y="174" text-anchor="middle" class="t sub">Length &amp; character sets</text>

  <path d="M 434 80 l 14 8 l -14 8" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <circle cx="544" cy="34" r="11" fill="#AF52DE"/>
  <text x="544" y="38" text-anchor="middle" class="t num">3</text>
  <circle cx="544" cy="88" r="34" fill="#AF52DE" fill-opacity="0.12"/>
  <text x="544" y="97" text-anchor="middle" class="t emoji">📲</text>
  <text x="544" y="152" text-anchor="middle" class="t title">Get the QR code</text>
  <text x="544" y="174" text-anchor="middle" class="t sub">Generated instantly</text>

  <path d="M 642 80 l 14 8 l -14 8" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <circle cx="752" cy="34" r="11" fill="#34C759"/>
  <text x="752" y="38" text-anchor="middle" class="t num">4</text>
  <circle cx="752" cy="88" r="34" fill="#34C759" fill-opacity="0.12"/>
  <text x="752" y="97" text-anchor="middle" class="t emoji">📶</text>
  <text x="752" y="152" text-anchor="middle" class="t title">Scan or join</text>
  <text x="752" y="174" text-anchor="middle" class="t sub">Scan with your phone, or</text>
  <text x="752" y="192" text-anchor="middle" class="t sub">join from this Mac in one click</text>
</svg>
