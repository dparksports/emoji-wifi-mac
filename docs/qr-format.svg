<svg xmlns="http://www.w3.org/2000/svg" width="880" height="175" viewBox="0 0 880 175" role="img" aria-label="Anatomy of the WIFI QR payload: prefix, encryption type, SSID, password, hidden flag">
  <style>
    .t { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: 'SF Mono', Menlo, Consolas, monospace; }
    .chip { font-size: 15px; font-weight: 600; }
    .lbl { font-size: 11.5px; }
    .cap { font-size: 13px; fill: #6b7280; }
  </style>
  <rect x="1" y="1" width="878" height="173" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="32" y="26" class="t" font-size="12" font-weight="700" fill="#9ca3af" letter-spacing="1">PAYLOAD ANATOMY</text>

  <!-- WIFI: -->
  <rect x="136" y="44" width="66" height="36" rx="8" fill="#f3f4f6"/>
  <text x="169" y="68" text-anchor="middle" class="m chip" fill="#6b7280">WIFI:</text>
  <text x="213" y="68" text-anchor="middle" class="m" font-size="14" fill="#9ca3af">;</text>
  <text x="169" y="106" text-anchor="middle" class="t lbl" fill="#6b7280">prefix</text>

  <!-- T:WPA -->
  <rect x="224" y="44" width="92" height="36" rx="8" fill="#eaf2ff"/>
  <text x="270" y="68" text-anchor="middle" class="m chip" fill="#0A84FF">T:WPA</text>
  <text x="327" y="68" text-anchor="middle" class="m" font-size="14" fill="#9ca3af">;</text>
  <text x="270" y="106" text-anchor="middle" class="t lbl" fill="#0A84FF">encryption type</text>

  <!-- S:SSID -->
  <rect x="338" y="44" width="126" height="36" rx="8" fill="#f5ecfe"/>
  <text x="401" y="68" text-anchor="middle" class="m chip" fill="#8b3dcf">S:🍕🚀🌌</text>
  <text x="475" y="68" text-anchor="middle" class="m" font-size="14" fill="#9ca3af">;</text>
  <text x="401" y="106" text-anchor="middle" class="t lbl" fill="#8b3dcf">network name (SSID)</text>

  <!-- P:password -->
  <rect x="486" y="44" width="124" height="36" rx="8" fill="#fff3e0"/>
  <text x="548" y="68" text-anchor="middle" class="m chip" fill="#c77700">P:••••••••</text>
  <text x="621" y="68" text-anchor="middle" class="m" font-size="14" fill="#9ca3af">;</text>
  <text x="548" y="106" text-anchor="middle" class="t lbl" fill="#c77700">password</text>

  <!-- H:false -->
  <rect x="632" y="44" width="94" height="36" rx="8" fill="#f3f4f6"/>
  <text x="679" y="68" text-anchor="middle" class="m chip" fill="#374151">H:false</text>
  <text x="679" y="106" text-anchor="middle" class="t lbl" fill="#374151">hidden network?</text>

  <text x="440" y="142" text-anchor="middle" class="t cap">The standard WPA WiFi QR payload — EmojiWifi generates it, and iOS &amp; Android cameras read it natively.</text>
</svg>
